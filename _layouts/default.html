<!DOCTYPE html>
<html lang="{{ site.locale | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  {% if site.description %}<meta name="description" content="{{ site.description }}">{% endif %}
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% if page.avatar %}<meta property="og:image" content="{{ page.avatar | absolute_url }}">{% endif %}
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ site.title }}">
  {% if page.avatar %}<meta name="twitter:image" content="{{ page.avatar | absolute_url }}">{% endif %}
</head>
<body>
  <div class="page">
    {{ content }}
  </div>
</body>
</html>
