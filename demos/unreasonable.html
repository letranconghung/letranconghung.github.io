    category: "Biology",
    equations: [
      { label: "Hodgkin–Huxley Model", tex: "C_m \\frac{dV}{dt} = -g_{Na}m^3h(V-E_{Na}) - g_K n^4(V-E_K) - g_L(V-E_L) + I" },
      { label: "Integrate-and-Fire Neuron", tex: "\\tau_m \\frac{dV}{dt} = -(V - V_{rest}) + R_m I(t)" }
    ],
    body: `<p>The Hodgkin-Huxley model (1952) describes the generation and propagation of nerve impulses using a system of differential equations fit to voltage-clamp experiments on squid axons. It won the Nobel Prize in 1963 — the same year as Wigner's.</p>
<p>The model treats ion channels as conductances governed by gating variables (m, h, n) that obey first-order ODEs. The action potential — the electrical spike that carries neural information — emerges as a solution to this system. The mathematics of electrical circuits (devised for wires and resistors) describes the language of thought.</p>
<p>The integrate-and-fire neuron, a simplification, is exactly the mathematics of a leaky capacitor charging to threshold. Neural computation, at this level, is analog electrical engineering described by the same equations Kirchhoff wrote down for telegraph lines.</p>
<p>Deeper still: the brain seems to perform Bayesian inference — probabilistic reasoning that follows from the axioms of probability theory, which are pure mathematics. Perception as probabilistic computation is described by mathematics developed for games of chance, not for brains.</p>`,
    connected: ["biology","chaos","stat_mech"]
  }
];

const links = [
  { source: "wigner", target: "classical" },
  { source: "wigner", target: "quantum" },
  { source: "wigner", target: "relativity" },
  { source: "wigner", target: "stat_mech" },
  { source: "wigner", target: "em" },
  { source: "wigner", target: "chemistry" },
  { source: "wigner", target: "biology" },
  { source: "classical", target: "quantum" },
  { source: "classical", target: "stat_mech" },
  { source: "classical", target: "chaos" },
  { source: "quantum", target: "qft" },
  { source: "quantum", target: "chemistry" },
  { source: "quantum", target: "relativity" },
  { source: "relativity", target: "qft" },
  { source: "relativity", target: "em" },
  { source: "em", target: "qft" },
  { source: "stat_mech", target: "chaos" },
  { source: "stat_mech", target: "chemistry" },
  { source: "stat_mech", target: "biology" },
  { source: "qft", target: "symmetry" },
  { source: "symmetry", target: "quantum" },
  { source: "symmetry", target: "chemistry" },
  { source: "chemistry", target: "biology" },
  { source: "chemistry", target: "thermo" },
  { source: "thermo", target: "stat_mech" },
  { source: "thermo", target: "biology" },
  { source: "biology", target: "evolution" },
  { source: "biology", target: "neuroscience" },
  { source: "evolution", target: "stat_mech" },
  { source: "chaos", target: "biology" },
  { source: "neuroscience", target: "chaos" },
];

// ─── COLOR MAP ────────────────────────────────────────────────
const groupColor = {
  root:      "#6060c8",
  physics:   "#4488cc",
  chemistry: "#cc8844",
  biology:   "#44aa66",
  math:      "#8855cc",
};

// ─── D3 SETUP ─────────────────────────────────────────────────
const svg = d3.select("#graph");
const W = window.innerWidth, H = window.innerHeight;
svg.attr("width", W).attr("height", H);

const g = svg.append("g");

// Zoom
svg.call(d3.zoom().scaleExtent([0.3, 3]).on("zoom", e => g.attr("transform", e.transform)));

// Simulation
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
    if (d.source.id === "wigner" || d.target.id === "wigner") return 170;
    return 120;
  }).strength(0.4))
  .force("charge", d3.forceManyBody().strength(-500))
  .force("center", d3.forceCenter(W / 2, H / 2))
  .force("collision", d3.forceCollide(d => d.r + 18));

// Links
const linkSel = g.append("g").selectAll("line")
  .data(links).join("line")
  .attr("class", "link")
  .attr("stroke", d => {
    const src = nodes.find(n => n.id === (d.source.id || d.source));
    return src ? groupColor[src.group] : "#444";
  })
  .attr("stroke-width", 1);

// Nodes
const nodeSel = g.append("g").selectAll("g")
  .data(nodes).join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
  )
  .on("click", (e, d) => openPanel(d));

nodeSel.append("circle")
  .attr("r", d => d.r)
  .attr("fill", d => d.color + "22")
  .attr("stroke", d => d.color)
  .attr("stroke-width", d => d.id === "wigner" ? 2.5 : 1.5);

nodeSel.append("text")
  .text(d => d.label)
  .attr("text-anchor", "middle")
  .attr("dy", d => d.r + 14)
  .attr("font-size", d => d.id === "wigner" ? 13 : 11)
  .attr("fill", d => d.color)
  .attr("opacity", 0.9);

sim.on("tick", () => {
  linkSel
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
});

// ─── PANEL ────────────────────────────────────────────────────
const panel = document.getElementById("panel");
const panelClose = document.getElementById("panel-close");

panelClose.addEventListener("click", () => {
  panel.classList.remove("open");
  resetHighlight();
});

let currentNode = null;

function openPanel(d) {
  currentNode = d;
  document.getElementById("panel-category").textContent = d.category;
  document.getElementById("panel-category").style.color = groupColor[d.group];
  document.getElementById("panel-title").textContent = d.label;
  document.getElementById("panel-year").textContent = d.year ? `c. ${d.year}` : "";

  // Equations
  const eqArea = document.getElementById("equation-area");
  eqArea.innerHTML = "";
  if (d.equations && d.equations.length) {
    d.equations.forEach(eq => {
      const block = document.createElement("div");
      block.className = "equation-block";
      block.innerHTML = `<div class="equation-label">${eq.label}</div><div class="eq-render" id="eq-${Math.random().toString(36).slice(2)}">\\[${eq.tex}\\]</div>`;
      eqArea.appendChild(block);
    });
  }

  // Body
  document.getElementById("panel-body").innerHTML = d.body;

  // Connected nodes
  const connArea = document.getElementById("connected-area");
  if (d.connected && d.connected.length) {
    const connNodes = d.connected.map(cid => nodes.find(n => n.id === cid)).filter(Boolean);
    connArea.innerHTML = `<div class="connected-label">Connected</div>` +
      connNodes.map(cn => `<span class="connected-chip" data-id="${cn.id}" style="border-color:#252540;color:${groupColor[cn.group]}88">${cn.label}</span>`).join("");
    connArea.querySelectorAll(".connected-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const target = nodes.find(n => n.id === chip.dataset.id);
        if (target) openPanel(target);
      });
    });
  } else {
    connArea.innerHTML = "";
  }

  panel.classList.add("open");
  highlightNode(d);

  // Typeset math
  if (window.MathJax) {
    MathJax.typesetPromise([eqArea]).catch(console.error);
  }
}

function highlightNode(d) {
  const connectedIds = new Set(d.connected || []);
  connectedIds.add(d.id);

  nodeSel.selectAll("circle")
    .attr("opacity", n => connectedIds.has(n.id) ? 1 : 0.2)
    .attr("stroke-width", n => n.id === d.id ? 3 : 1.5);

  linkSel
    .attr("opacity", l => {
      const sid = l.source.id || l.source;
      const tid = l.target.id || l.target;
      return (sid === d.id || tid === d.id) ? 0.8 : 0.05;
    })
    .attr("stroke-width", l => {
      const sid = l.source.id || l.source;
      const tid = l.target.id || l.target;
      return (sid === d.id || tid === d.id) ? 2 : 1;
    });

  nodeSel.selectAll("text")
    .attr("opacity", n => connectedIds.has(n.id) ? 1 : 0.15);
}

function resetHighlight() {
  nodeSel.selectAll("circle").attr("opacity", 1).attr("stroke-width", d => d.id === "wigner" ? 2.5 : 1.5);
  linkSel.attr("opacity", 0.35).attr("stroke-width", 1);
  nodeSel.selectAll("text").attr("opacity", 0.9);
}

// Open wigner node on load after simulation settles
setTimeout(() => openPanel(nodes[0]), 900);
</script>
</body>
</html>
